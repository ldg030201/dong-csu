name: bottle

# 미리 빌드한 결과물(bottle)을 릴리스에 올린다.
# 이게 없으면 설치할 때마다 각자 컴퓨터에서 Swift를 컴파일해 30초쯤 걸린다.
# bottle이 있으면 압축만 풀어서 몇 초로 끝난다. 맞는 bottle이 없는 환경은
# Homebrew가 알아서 소스 빌드로 넘어가므로 이 워크플로가 실패해도 설치는 된다.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "bottle을 만들 태그 (예: mac-v2.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Homebrew 는 자기 판 bottle 이 없으면 같은 칩의 **더 낮은 판** bottle 을 받는다
          # (높은 판 것은 안 받는다). 그래서 여기 없는 새 판(27 등)은 26 것을 받고,
          # 15 보다 낮은 판(14)만 소스에서 빌드한다(30초쯤 걸릴 뿐 실패하지는 않는다).
          #
          # **15 하나로 합치지 않는다.** Homebrew 는 빌드할 때 SDK 를 그 러너에 깔린
          # Command Line Tools 의 것으로 못 박아서(Xcode 를 바꿔도 소용없다), 15 에서
          # 만들면 15 SDK 로 링크된다. 낡은 SDK 로 링크한 앱은 26 이상에서 새 모양
          # (Liquid Glass)이 안 붙는다. 그래서 26 은 26 러너에서 따로 만든다.
          - os: macos-15   # arm64 Sequoia (macOS 15) — 15 가 받는다
          - os: macos-26   # arm64 Tahoe (macOS 26) — 26 과 그 위가 받는다
    runs-on: ${{ matrix.os }}
    steps:
      - name: Homebrew 준비
        uses: Homebrew/actions/setup-homebrew@2026.08.03.2

      - name: tap 추가
        run: |
          # 러너에 미리 깔린 tap이 신뢰되지 않아 Homebrew가 매번 경고한다. 쓰지 않으니 뗀다.
          brew untap aws/tap 2>/dev/null || true
          brew tap ldg030201/dong-csu https://github.com/ldg030201/dong-csu
          brew trust ldg030201/dong-csu || true

      - name: bottle 빌드
        run: |
          brew install --build-bottle ldg030201/dong-csu/dong-csu
          brew bottle --json --no-rebuild ldg030201/dong-csu/dong-csu

      - name: 결과 수집
        uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.os }}
          path: |
            *.bottle.tar.gz
            *.bottle.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Homebrew 준비
        uses: Homebrew/actions/setup-homebrew@2026.08.03.2

      - name: tap 추가
        run: |
          # 러너에 미리 깔린 tap이 신뢰되지 않아 Homebrew가 매번 경고한다. 쓰지 않으니 뗀다.
          brew untap aws/tap 2>/dev/null || true
          brew tap ldg030201/dong-csu https://github.com/ldg030201/dong-csu
          brew trust ldg030201/dong-csu || true

      - name: bottle 내려받기
        uses: actions/download-artifact@v8
        with:
          path: bottles
          merge-multiple: true

      - name: formula에 bottle 블록 쓰기
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          cd bottles
          # 파일 이름의 -- 는 업로드 후 URL과 맞추기 위해 - 로 바꾼다.
          for f in *.bottle.tar.gz; do mv "$f" "${f/--/-}"; done
          brew bottle --merge --write --no-commit \
            --root-url="https://github.com/ldg030201/dong-csu/releases/download/$TAG" \
            *.bottle.json
          cd ..
          # --write 는 tap 클론 쪽 formula를 고친다. 저장소로 되가져온다.
          cp "$(brew --repository ldg030201/dong-csu)/Formula/dong-csu.rb" Formula/dong-csu.rb

          # --root-url 이 formula 에 기록되지 않는 경우가 있다. 없으면 직접 넣는다.
          # 이게 빠지면 Homebrew 가 공식 저장소(ghcr.io)에서 찾다가 404 로 실패한다.
          # awk로 줄을 하나 끼워 넣는다. macOS의 BSD sed는 치환문의 \n을 개행으로
          # 바꾸지 않아서, 예전에 리터럴 "\n"이 그대로 박혀 formula가 깨졌다(v1.4.0).
          if ! grep -q 'root_url' Formula/dong-csu.rb; then
            ROOT_URL="https://github.com/ldg030201/dong-csu/releases/download/$TAG"
            awk -v url="$ROOT_URL" '
              { print }
              /^  bottle do$/ { print "    root_url \"" url "\"" }
            ' Formula/dong-csu.rb > Formula/dong-csu.rb.tmp
            mv Formula/dong-csu.rb.tmp Formula/dong-csu.rb
          fi

          # 문법이 깨지면 아무도 설치할 수 없다. 올리기 전에 여기서 막는다.
          ruby -c Formula/dong-csu.rb
          grep -A4 'bottle do' Formula/dong-csu.rb

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" bottles/*.bottle.tar.gz --clobber

      - name: formula 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dong-csu.rb
          git diff --cached --quiet && { echo "바뀐 게 없다"; exit 0; }
          git commit -m "📦 bottle 추가"

          # 이 작업이 도는 1~2분 사이에 main 이 움직였을 수 있다. 그때 그냥 밀면
          # 거부당하고, **bottle 은 릴리스에 올라갔는데 formula 는 그걸 모르는**
          # 상태로 남는다(설치가 계속 소스 빌드로 떨어진다). 따라잡고 다시 민다.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "main 이 앞서 있다 — 따라잡고 다시 시도 ($attempt/3)"
            git pull --rebase origin main
          done
          echo "formula 를 밀지 못했다" >&2
          exit 1
