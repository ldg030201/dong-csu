name: build (win)

# 윈도우판이 빌드되고 테스트가 통과하는지 확인한다.
#
# **맥과 나눠 뒀다.** 한 파일에 두면 어느 한쪽만 깨져도 워크플로 전체가 빨개져서,
# 맥 릴리스가 윈도우 테스트 때문에 빨간 것으로 보였다. 자세한 건 `build-mac.yml`.
#
# **태그는 안 본다.** `win-v*` 는 `win-release.yml` 이 받아서 거기서 테스트까지 돈다.
# 여기서 또 걸면 같은 것을 두 번 돌린다.
#
# 대신 **`shared/**` 가 바뀌는 순간**을 본다. 맥이 부엉이 데이터를 다시 뽑으면 윈도우
# 앱에 박아 둔 사본이 그 자리에서 낡는데, 윈도우 릴리스까지 기다리면 너무 늦다.
#
# `push` 아래에서 `tags` 와 `paths` 를 같이 쓰면 둘이 **AND** 로 걸려서 태그 트리거가
# 죽는다. 그래서 여기는 브랜치만 본다.
on:
  push:
    branches:
      - main
    paths:
      - "win/**"
      - "shared/**"
      - ".github/workflows/build-win.yml"
      - ".github/actions/win-checks/**"
  pull_request:
    paths:
      - "win/**"
      - "shared/**"
      - ".github/workflows/build-win.yml"
      - ".github/actions/win-checks/**"
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 도구 버전
        run: dotnet --info

      - name: 빌드
        run: dotnet build -c Release

      # 부엉이 그림이 맥과 같은지 여기서 걸린다. 레이어 겹치기는 파일로 넘어오지 않아
      # 윈도우가 따로 구현했고, owl.json 에 실린 맥의 합성 결과와 전 프레임을 대조한다.
      - name: 테스트
        run: dotnet test -c Release --no-build

      # 시트를 실제로 재서 칸 표(MascotSheet)와 맞대 본다.
      #
      # **칸 표는 맥 MascotSprite.swift 를 손으로 옮겨 적은 것인데, 격자 부엉이
      # (shared/owl.json)와 달리 어긋났는지 알려 주는 것이 아무것도 없었다.** 그림은
      # 맥 번들과 같은 파일이라 안 갈리지만 그 그림을 어떻게 읽느냐는 갈릴 수 있고,
      # 갈려도 화면에 그럴듯한 것이 나와서 안 드러난다.
      #
      # **여기에만 두고 win-checks 로 빼지 않는다.** 이건 앱(App)을 빌드해야 돌아가는데
      # win-release 는 그 자리에서 App 을 아직 안 빌드했다. 도구 프로젝트만으로는
      # 못 한다 — PNG 를 읽는 데 WPF 가 필요하고 Core 는 맥에서도 컴파일돼야 한다.
      - name: 시트가 칸 표와 맞는지
        shell: pwsh
        run: |
          # **`& $exe` 로 부르지 마라.** 이 앱은 `WinExe`(창 프로그램)라 PowerShell 이
          # 끝나기를 기다리지 않고, 그러면 `$LASTEXITCODE` 가 아예 안 채워진다(`$null`).
          # `$null -ne 0` 이 참이라 **늘 실패로 떨어진다** — 실제로 "통과" 를 찍고도
          # 빨개졌다. 앞으로 앱을 부르는 검사를 더할 때도 이 방식을 그대로 써라.
          $exe = "src/DongCSU.App/bin/Release/net10.0-windows/win-x64/DongCSU.exe"
          $log = Join-Path $env:RUNNER_TEMP "probe-mascot.txt"
          $run = Start-Process -FilePath $exe -ArgumentList '--probe-mascot' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log
          Get-Content $log -Encoding UTF8
          if ($run.ExitCode -ne 0) {
            Write-Error "시트와 MascotSheet 의 칸 표가 어긋난다 — 맥 MascotSprite.swift 를 다시 봐라"
            exit 1
          }

      # 측정 화면의 버튼이 실제로 먹는지. **그리는 것과 다른 검사다** —
      # `--render-settings` 는 화면을 보여줄 뿐이고, *시작을 누르면 정말 재기 시작하는가*
      # 는 눌러 보고 그 뒤 상태를 봐야 안다. 배치를 바꾸다 버튼과 판정이 어긋나면
      # 화면은 멀쩡한 채로 아무 일도 안 일어나는데, 그걸 여기서 잡는다.
      #
      # **이건 바깥 것에 안 기댄다** — 저장소도 기록 폴더도 임시 자리를 쓰고 기록 한 줄을
      # 지어내므로 빌드 기계에서도 돈다(`--probe-tokens` 를 CI 에 안 넣는 이유와 다르다).
      - name: 측정 화면의 버튼이 먹는지
        shell: pwsh
        run: |
          $exe = "src/DongCSU.App/bin/Release/net10.0-windows/win-x64/DongCSU.exe"
          $log = Join-Path $env:RUNNER_TEMP "probe-meter-ui.txt"
          $run = Start-Process -FilePath $exe -ArgumentList '--probe-meter','ui' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log
          Get-Content $log -Encoding UTF8
          if ($run.ExitCode -ne 0) {
            Write-Error "측정 화면의 버튼이 안 먹는다"
            exit 1
          }

      # 대조 검사 셋은 win-release 도 똑같이 돌려야 해서 composite action 으로 뽑아 뒀다.
      # 여기에는 `working-directory` 를 쓸 수 없어서(uses: 단계라) action 이 입력으로 받는다.
      - uses: ./.github/actions/win-checks
