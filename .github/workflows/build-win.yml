name: build (win)

# 윈도우판이 빌드되고 테스트가 통과하는지 확인한다.
#
# **맥과 나눠 뒀다.** 한 파일에 두면 어느 한쪽만 깨져도 워크플로 전체가 빨개져서,
# 맥 릴리스가 윈도우 테스트 때문에 빨간 것으로 보였다. 자세한 건 `build-mac.yml`.
#
# **태그는 안 본다.** `win-v*` 는 `win-release.yml` 이 받아서 거기서 테스트까지 돈다.
# 여기서 또 걸면 같은 것을 두 번 돌린다.
#
# 대신 **`shared/**` 가 바뀌는 순간**을 본다. 맥이 부엉이 데이터를 다시 뽑으면 윈도우
# 앱에 박아 둔 사본이 그 자리에서 낡는데, 윈도우 릴리스까지 기다리면 너무 늦다.
#
# `push` 아래에서 `tags` 와 `paths` 를 같이 쓰면 둘이 **AND** 로 걸려서 태그 트리거가
# 죽는다. 그래서 여기는 브랜치만 본다.
on:
  push:
    branches:
      - main
    paths:
      - "win/**"
      - "shared/**"
      - ".github/workflows/build-win.yml"
  pull_request:
    paths:
      - "win/**"
      - "shared/**"
      - ".github/workflows/build-win.yml"
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 도구 버전
        run: dotnet --info

      - name: 빌드
        run: dotnet build -c Release

      # 부엉이 그림이 맥과 같은지 여기서 걸린다. 레이어 겹치기는 파일로 넘어오지 않아
      # 윈도우가 따로 구현했고, owl.json 에 실린 맥의 합성 결과와 전 프레임을 대조한다.
      - name: 테스트
        run: dotnet test -c Release --no-build

      # 앱에 박아 둔 부엉이가 저장소의 것과 같은지. 다르면 맥과 다른 그림을 그린다.
      - name: 부엉이 데이터가 저장소의 것과 같은지
        shell: bash
        run: |
          dotnet run --project tools/DongCSU.Tools -c Release --no-build -- --dump-owl /tmp/win-owl.json
          diff -q /tmp/win-owl.json ../shared/owl.json \
            || { echo "앱에 박힌 owl.json 이 shared/owl.json 과 다르다 — 다시 빌드해라"; exit 1; }

      - name: 변경 내역 파일이 소스와 맞는지
        shell: bash
        run: |
          dotnet run --project tools/DongCSU.Tools -c Release --no-build -- --dump-changelog /tmp/win-changelog.json
          diff -q /tmp/win-changelog.json docs/changelog.json \
            || { echo "win/docs/changelog.json 이 Changelog.cs 와 다르다 — --dump-changelog 로 다시 뽑아라"; exit 1; }

      # 아이콘 파일을 바이트로 비교하지 않는다 — PNG 압축 결과가 zlib 판마다 달라서
      # 같은 그림인데도 어긋난다. 무엇으로 만들었는지(지문)를 본다.
      - name: 아이콘이 부엉이 데이터와 맞는지
        run: dotnet run --project tools/DongCSU.Tools -c Release --no-build -- --check-icon src/DongCSU.App/Resources/DongCSU.ico
