name: win-release

# 윈도우판을 만들어 릴리스에 올린다.
#
# 맥은 Homebrew 가 각자 기계에서 소스를 빌드하지만, 윈도우는 여기서 만든 설치 exe 를
# 받아서 쓴다. Velopack 이 설치본과 델타를 만들고, 앱은 GitHub 릴리스를 보고 스스로
# 업데이트한다.

on:
  push:
    tags: ["win-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "만들 버전 (예: 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 버전 정하기
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#win-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 테스트
        run: dotnet test tests/DongCSU.Core.Tests/DongCSU.Core.Tests.csproj -c Release

      # 태그만 붙이고 변경 내역을 안 적으면, 사용자는 새 버전을 받았는데
      # 설정 창의 버전 탭에 아무것도 안 뜬다.
      - name: 변경 내역이 이 버전을 아는지
        run: >
          dotnet run --project tools/DongCSU.Tools -c Release --
          --check-release ${{ steps.version.outputs.value }}

      - name: 게시
        run: >
          dotnet publish src/DongCSU.App -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.value }} -o publish

      - name: 설치본 만들기
        run: |
          # 라이브러리(DongCSU.App.csproj 의 Velopack)와 **같은 번호**여야 한다.
          # 어긋나면 vpk 가 경고를 내고, 만든 설치본이 앱의 업데이트 코드와 안 맞을 수 있다.
          dotnet tool install -g vpk --version 1.2.0
          # **--shortcuts 를 적어 둔다.** 기본값에 맡기면 vpk 판이 바뀔 때 조용히 달라지는데,
          # 바로가기가 없으면 사용자는 깔고도 앱을 찾지 못한다(트레이에만 뜨는 앱이라 더 그렇다).
          vpk pack --packId DongCSU --packVersion ${{ steps.version.outputs.value }} `
            --packDir publish --mainExe DongCSU.exe `
            --packTitle DongCSU --packAuthors ldg030201 `
            --icon src/DongCSU.App/Resources/DongCSU.ico `
            --shortcuts StartMenu,Desktop `
            --outputDir releases

      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/win-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 제목 형식을 바꾸지 마라. `Windows <버전>` 으로 어느 판인지 가른다 —
          # GitHub 의 "Latest" 는 저장소에 하나뿐이라 맥과 나눌 방법이 이것뿐이다.
          gh release create "$GITHUB_REF_NAME" --title "Windows ${{ steps.version.outputs.value }}" --generate-notes \
            || echo "릴리스가 이미 있다 — 파일만 올린다"
          # **Portable zip 은 올리지 않는다** — 68MB 인데 설치 exe 와 내용이 같다.
          # 나머지는 빼면 안 된다: .nupkg 는 자체 업데이트가 **실제로 받아 가는 파일**이고,
          # releases.win.json 은 앱이 새 버전을 찾는 목록이다. 지우면 업데이트가 죽는다.
          rm -f releases/*-Portable.zip
          gh release upload "$GITHUB_REF_NAME" releases/* --clobber

      # 뿌리 README 의 "지금 버전" 줄. **배지가 아니라 글자라 여기서 안 올리면 낡는다.**
      # 맥 칸은 mac/release.sh 가 올린다 — 우리는 윈도우 칸(두 번째 숫자)만 건드린다.
      - name: README 의 윈도우 버전 갱신
        if: startsWith(github.ref, 'refs/tags/win-v')
        working-directory: .
        shell: bash
        run: |
          sed -i -E "s#^(\| 지금 버전 \| [0-9.]+ \| )[0-9.]+#\1${{ steps.version.outputs.value }}#" README.md
          # 손으로 미리 올려 뒀으면 바뀐 것이 없다. 그때는 조용히 넘어간다.
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "📝 README 의 윈도우 버전을 ${{ steps.version.outputs.value }} 으로 갱신"
          # 태그에서 돌아 HEAD 가 분리돼 있다. 기본 가지에 얹는다.
          git push origin HEAD:main

      - name: 결과 수집
        uses: actions/upload-artifact@v7
        with:
          name: DongCSU-Setup
          path: win/releases/*
          if-no-files-found: error
