name: lockdown

# 남이 이 저장소에 변경을 밀어 넣지 못하게 한다.
#
# 쓰기 권한은 소유자에게만 있어서 코드를 직접 바꿀 수는 없다. 남은 구멍은 **누구나
# 포크해서 PR 을 열 수 있다**는 것인데, GitHub 은 개인 공개 저장소의 포크를 막지 못한다.
#
# 두 겹으로 막는다.
#
#   1. 상호작용 제한 (저장소 설정) — 협업자가 아니면 PR·이슈·댓글을 못 연다.
#      **손으로 걸어 둔다.** GitHub 이 최대 6개월까지만 허용하고, 갱신에 필요한
#      admin 권한은 워크플로 토큰(GITHUB_TOKEN)이 가질 수 없다. 만료되면 다시:
#
#        gh api -X PUT repos/ldg030201/dong-csu/interaction-limits \
#          -f limit=collaborators_only -f expiry=six_months
#
#   2. 그래도 열린 PR 은 여기서 닫는다. 1번이 만료된 틈에 들어온 것을 잡는 그물이라
#      기한이 없다. 이쪽만으로도 막히긴 한다.

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 협업자가 아니면 닫는다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR" --silent 2>/dev/null; then
            echo "$AUTHOR 는 협업자다 — 그대로 둔다"
            exit 0
          fi
          gh pr close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment \
            "개인 프로젝트라 외부 변경을 받지 않습니다. 관심 가져 주셔서 고맙습니다."
